services:
  postgres:
    image: postgres:16-alpine
    container_name: aep-notification-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aep_notifications}
      POSTGRES_USER: ${POSTGRES_USER:-aep_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aep_notification_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aep_app} -d ${POSTGRES_DB:-aep_notifications}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aep_notification_pgdata:
